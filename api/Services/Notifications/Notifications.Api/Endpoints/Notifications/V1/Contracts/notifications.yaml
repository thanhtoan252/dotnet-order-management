openapi: "3.1.0"

info:
  title: Notifications API
  version: "1.0"
  description: Notification and template operations.

servers:
  - url: http://localhost:5076
    description: Local development

tags:
  - name: Notifications

paths:
  /api/notifications:
    get:
      tags: [ Notifications ]
      operationId: GetMyNotifications
      summary: List notifications visible to the current user.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NotificationStatus"
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"

    post:
      tags: [ Notifications ]
      operationId: SendAdminNotification
      summary: Send a notification to a user or broadcast to everyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAdminNotificationRequest"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/notifications/unread-count:
    get:
      tags: [ Notifications ]
      operationId: GetUnreadCount
      summary: Unread notification count for the current user.
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"

  /api/notifications/{id}/read:
    post:
      tags: [ Notifications ]
      operationId: MarkNotificationAsRead
      summary: Mark a single notification as read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notification marked as read
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/notifications/mark-all-read:
    post:
      tags: [ Notifications ]
      operationId: MarkAllNotificationsAsRead
      summary: Mark all visible unread notifications as read.
      responses:
        "200":
          description: Updated notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResponse"

  /api/notifications/templates:
    get:
      tags: [ Notifications ]
      operationId: GetNotificationTemplates
      summary: List all notification templates.
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateResponse"

  /api/notifications/templates/{id}:
    put:
      tags: [ Notifications ]
      operationId: UpdateNotificationTemplate
      summary: Update a notification template.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateRequest"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    NotificationType:
      type: string
      enum:
        - OrderPlaced
        - OrderConfirmed
        - OrderCancelled
        - StockReservationFailed
        - ProductCreated
        - ProductRenamed
        - ProductDeleted
        - AdminBroadcast

    NotificationStatus:
      type: string
      enum:
        - Unread
        - Read
        - Archived

    SendAdminNotificationRequest:
      type: object
      required: [ title, body ]
      properties:
        userId:
          type: [ string, "null" ]
          format: uuid
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 2000
        metadata:
          type: [ string, "null" ]

    UpdateTemplateRequest:
      type: object
      required: [ title, bodyTemplate, isActive ]
      properties:
        title:
          type: string
          maxLength: 200
        bodyTemplate:
          type: string
          maxLength: 2000
        isActive:
          type: boolean

    NotificationResponse:
      type: object
      required: [ id, type, title, body, status, createdAt ]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: [ string, "null" ]
          format: uuid
        orderId:
          type: [ string, "null" ]
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/NotificationStatus"
        metadata:
          type: [ string, "null" ]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [ string, "null" ]
          format: date-time

    TemplateResponse:
      type: object
      required: [ id, type, title, bodyTemplate, isActive, updatedAt ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        bodyTemplate:
          type: string
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    UnreadCountResponse:
      type: object
      required: [ unreadCount ]
      properties:
        unreadCount:
          type: integer

    MarkAllReadResponse:
      type: object
      required: [ updated ]
      properties:
        updated:
          type: integer

    ProblemDetails:
      type: object
      properties:
        statusCode:
          type: integer
        title:
          type: string
        detail:
          type: string
        traceId:
          type: string
        stackTrace:
          type: [ string, "null" ]
