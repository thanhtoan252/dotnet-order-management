<div class="flex flex-col gap-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-bold">Users</h2>
      <p class="mt-0.5 text-sm opacity-60">
        {{ count() }} user{{ count() !== 1 ? 's' : '' }} loaded
      </p>
    </div>
    <div class="flex items-center gap-2">
      <form class="relative" (submit)="applySearch($event)">
        <lucide-icon
          [img]="Search"
          class="absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 opacity-40"
        />
        <input
          pInputText
          type="search"
          class="w-72 pl-8"
          placeholder="Search by username or email…"
          [value]="searchInput()"
          (input)="searchInput.set($any($event.target).value)"
        />
      </form>
      <p-button [outlined]="true" (onClick)="applySearch()" [disabled]="users.isFetching()">
        <lucide-icon
          [img]="RefreshCw"
          class="mr-1 h-4 w-4"
          [class.animate-spin]="users.isFetching()"
        />
        Refresh
      </p-button>
      <p-button (onClick)="openCreate()">
        <lucide-icon [img]="Plus" class="mr-1 h-4 w-4" />
        Add User
      </p-button>
    </div>
  </div>

  <div
    class="overflow-hidden rounded-xl border shadow-sm"
    style="border-color: var(--p-content-border-color); background: var(--p-content-background)"
  >
    <app-users-table
      [users]="users.data() ?? []"
      [loading]="users.isFetching()"
      [canManage]="perms.canManageUsers()"
      (edit)="openEdit($event)"
      (manageRoles)="openRoles($event)"
      (resetPassword)="openReset($event)"
      (remove)="confirmDelete($event)"
    />
  </div>
</div>
