<div class="flex flex-col gap-3 pt-1">
  <div class="rounded-lg px-3 py-2 text-xs" style="background: var(--p-surface-100)">
    User: <span class="font-mono font-semibold">{{ user.username }}</span>
  </div>
  <form [formGroup]="form" class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium">New Password</label>
      <input pInputText type="password" formControlName="password" class="w-full" />
      @if (form.controls.password.hasError('zod') && form.controls.password.touched) {
        <small class="text-red-500">{{ form.controls.password.getError('zod') }}</small>
      }
    </div>
    <label class="flex items-center gap-2 text-sm">
      <p-checkbox formControlName="temporary" [binary]="true" />
      Temporary - user must change on next login
    </label>
  </form>
</div>
<div class="mt-6 flex justify-end gap-2">
  <p-button
    label="Cancel"
    [text]="true"
    severity="secondary"
    [disabled]="mut.isPending()"
    (onClick)="cancel()"
  />
  <p-button label="Reset Password" [disabled]="mut.isPending()" (onClick)="submit()" />
</div>
