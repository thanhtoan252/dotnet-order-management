<div class="flex flex-col gap-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-bold">Inventory</h2>
      <p class="mt-0.5 text-sm opacity-60">
        {{ count() }} item{{ count() !== 1 ? 's' : '' }} tracked
      </p>
    </div>
    <p-button [outlined]="true" (onClick)="inventory.refetch()" [disabled]="inventory.isFetching()">
      <lucide-icon
        [img]="RefreshCw"
        class="mr-1 h-4 w-4"
        [class.animate-spin]="inventory.isFetching()"
      />
      Refresh
    </p-button>
  </div>

  <div
    class="overflow-hidden rounded-xl border shadow-sm"
    style="border-color: var(--p-content-border-color); background: var(--p-content-background)"
  >
    <app-inventory-table
      [items]="inventory.data() ?? []"
      [loading]="inventory.isFetching()"
      [canManage]="perms.canManageInventory()"
      (receive)="openReceive($event)"
      (adjust)="openAdjust($event)"
    />
  </div>
</div>
