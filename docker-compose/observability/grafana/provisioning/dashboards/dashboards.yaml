apiVersion: 1

providers:
  - name: 'order-management'
    orgId: 1
    folder: 'Order Management'
    folderUid: order-mgmt
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
