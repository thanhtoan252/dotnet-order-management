receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: deployment.environment
        action: upsert
  # Promote selected resource/log attributes to Loki labels so log<->trace correlation works.
  attributes/loki:
    actions:
      - action: insert
        key: loki.attribute.labels
        value: service.name,service.namespace,deployment.environment,level
      - action: insert
        key: loki.resource.labels
        value: service.name,service.namespace,deployment.environment

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true

  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: false
    # Promote resource attributes (service.name, service.namespace, ...) to metric labels
    # so dashboards can filter with service_name="identity-api" etc.
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch, resource, attributes/loki]
      exporters: [loki]
